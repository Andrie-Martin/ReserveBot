# ReserveBot: the whole system in containers (website, reminder emails, database, phpMyAdmin).
#
#   docker compose up --build    start everything (the first run downloads a few hundred MB)
#   http://localhost:8000        the website
#   http://localhost:8080        phpMyAdmin
#   Ctrl+C, then
#   docker compose down          stop (your data is kept)
#   docker compose down -v       stop AND wipe the database and photos; the next start rebuilds it with the test data
name: reservebot

services:
  db:
    image: mariadb:10.11                       # same version as XAMPP
    command: ["--default-time-zone=+08:00"]    # Philippine time for NOW() and CURDATE()
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: reservebot
      MARIADB_USER: reservebot
      MARIADB_PASSWORD: reservebot
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"                            # 3307 on your PC, so it doesn't clash with XAMPP
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    environment: &app-environment                # the scheduler below uses the same settings
      APP_NAME: ReserveBot
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # Uses APP_KEY from your .env if you have one; otherwise a development-only key
      APP_KEY: ${APP_KEY:-base64:a4BmvBlJnAj93YSkzq2JPx26kBzBIsa5xRYusk2MZV0=}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: reservebot
      DB_USERNAME: reservebot
      DB_PASSWORD: reservebot
      SESSION_LIFETIME: 480
      LOG_CHANNEL: stderr                      # Laravel's log shows up in this window
      # Messenger bot (paused): taken from your .env if set
      VERIFY_TOKEN: ${VERIFY_TOKEN:-}
      PAGE_ACCESS_TOKEN: ${PAGE_ACCESS_TOKEN:-}
      # Email (Gmail, see README): taken from your .env if set; otherwise emails only show in this window
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-reservebot@example.com}
      MAIL_FROM_NAME: ReserveBot
    volumes:
      - photos:/var/www/html/storage/app/private/photos   # profile photos survive rebuilds
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy             # wait until the database is ready
    restart: unless-stopped

  # Phase 10: sends the reminder and "is your class face-to-face?" emails (checks every minute).
  # Same code and settings as the website; it runs Laravel's scheduler instead of Apache.
  scheduler:
    build: .
    entrypoint: ["php", "artisan", "schedule:work"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started             # the website's start builds or updates the tables
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  photos:
